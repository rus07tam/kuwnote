name: Build Android (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      target_arch:
        description: 'Target Architecture'
        required: false
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64
          - all

permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        shell: bash
        run: |
          ANDROID_SDK_DIR="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_SDK_DIR" ] && [ -d "$ANDROID_HOME" ]; then
            ANDROID_SDK_DIR="$ANDROID_HOME"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_DIR/platform-tools" >> $GITHUB_PATH
          
          # Accept SDK licenses non-interactively
          if [ -f "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure NDK Environment
        shell: bash
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Initialize Android Target (if needed)
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android target..."
            npx tauri android init --ci --skip-targets-install
          fi
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi

      - name: Build Android Targets
        shell: bash
        run: |
          BUILD_OPT="${{ github.event.inputs.build_type || 'apk' }}"
          TARGET_ARCH="${{ github.event.inputs.target_arch || 'aarch64' }}"

          TARGET_FLAG=""
          if [ "$TARGET_ARCH" != "all" ]; then
            TARGET_FLAG="--target $TARGET_ARCH"
          fi

          if [ "$BUILD_OPT" = "apk" ]; then
            npx tauri android build --apk $TARGET_FLAG --ci
          elif [ "$BUILD_OPT" = "aab" ]; then
            npx tauri android build --aab $TARGET_FLAG --ci
          else
            npx tauri android build --apk --aab $TARGET_FLAG --ci
          fi

      - name: Collect Android Outputs
        id: collect
        shell: bash
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-android/ \; || true
          ls -lh dist-android || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-android-packages
          path: dist-android/*
          if-no-files-found: warn
