name: Build Android (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      build_type:
        description: 'Android Package Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      target_arch:
        description: 'Target Architecture'
        required: false
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - armv7
          - x86_64
          - all

permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        shell: bash
        run: |
          ANDROID_SDK_DIR="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_SDK_DIR" ] && [ -d "$ANDROID_HOME" ]; then
            ANDROID_SDK_DIR="$ANDROID_HOME"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_DIR/platform-tools" >> $GITHUB_PATH
          
          # Accept SDK licenses non-interactively
          if [ -f "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure NDK Environment
        shell: bash
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating standard Android debug keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l ~/.android/debug.keystore

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Initialize Android Target (if needed)
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android target..."
            npx tauri android init --ci --skip-targets-install
          fi
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi

      - name: Configure Gradle Signing with Debug Certificate
        shell: bash
        run: |
          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          GRADLE_GROOVY="src-tauri/gen/android/app/build.gradle"

          if [ -f "$GRADLE_KTS" ]; then
            echo "Configuring release signing config in $GRADLE_KTS..."
            if ! grep -q 'signingConfig = signingConfigs' "$GRADLE_KTS"; then
              sed -i 's/getByName("release") {/getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")/' "$GRADLE_KTS"
            fi
          elif [ -f "$GRADLE_GROOVY" ]; then
            echo "Configuring release signing config in $GRADLE_GROOVY..."
            if ! grep -q 'signingConfig signingConfigs' "$GRADLE_GROOVY"; then
              sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' "$GRADLE_GROOVY"
            fi
          fi

      - name: Build Android Targets
        shell: bash
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'debug' }}"
          BUILD_OPT="${{ github.event.inputs.build_type || 'apk' }}"
          TARGET_ARCH="${{ github.event.inputs.target_arch || 'aarch64' }}"

          MODE_FLAG=""
          if [ "$BUILD_MODE" = "debug" ]; then
            MODE_FLAG="--debug"
          fi

          TARGET_FLAG=""
          if [ "$TARGET_ARCH" != "all" ]; then
            TARGET_FLAG="--target $TARGET_ARCH"
          fi

          echo "Running Tauri Android build (mode=$BUILD_MODE, target=$TARGET_ARCH, type=$BUILD_OPT)..."
          if [ "$BUILD_OPT" = "apk" ]; then
            npx tauri android build --apk $MODE_FLAG $TARGET_FLAG --ci
          elif [ "$BUILD_OPT" = "aab" ]; then
            npx tauri android build --aab $MODE_FLAG $TARGET_FLAG --ci
          else
            npx tauri android build --apk --aab $MODE_FLAG $TARGET_FLAG --ci
          fi

      - name: Sign & Verify Android Artifacts with Debug Certificate
        shell: bash
        run: |
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          mkdir -p dist-android

          # Process all APK files
          while IFS= read -r -d '' apk; do
            echo "--- Checking APK: $apk ---"
            FILENAME=$(basename "$apk")

            # Check existing signature
            if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              echo "Valid signature already present on $FILENAME"
              cp "$apk" "dist-android/$FILENAME"
            else
              echo "$FILENAME is unsigned or invalid. Aligning and signing with debug certificate..."
              OUTNAME="${FILENAME/-unsigned/-signed}"
              if [ "$OUTNAME" = "$FILENAME" ]; then
                OUTNAME="signed-$FILENAME"
              fi

              # Zipalign
              "$ZIPALIGN" -f -p 4 "$apk" "dist-android/$OUTNAME" || cp "$apk" "dist-android/$OUTNAME"

              # Sign with apksigner (v1, v2, v3 schemes)
              "$APKSIGNER" sign \
                --ks ~/.android/debug.keystore \
                --ks-pass pass:android \
                --key-pass pass:android \
                --ks-key-alias androiddebugkey \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "dist-android/$OUTNAME"

              # Also maintain primary output name as signed copy
              cp "dist-android/$OUTNAME" "dist-android/$FILENAME"
            fi
          done < <(find src-tauri/gen/android -type f -name "*.apk" -print0)

          # Process any AAB bundles
          while IFS= read -r -d '' aab; do
            echo "--- Processing AAB: $aab ---"
            FILENAME=$(basename "$aab")
            cp "$aab" "dist-android/$FILENAME"
            jarsigner -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              "dist-android/$FILENAME" androiddebugkey || true
          done < <(find src-tauri/gen/android -type f -name "*.aab" -print0)

          # Verify all final APK packages in dist-android
          echo "=== Verification Results for Uploaded APKs ==="
          for apk in dist-android/*.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $(basename "$apk"):"
              "$APKSIGNER" verify --verbose "$apk"
            fi
          done

          ls -lh dist-android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-android-packages
          path: dist-android/*
          if-no-files-found: warn
