name: Build Android (APK & AAB)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Initialize Android Target (if needed)
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android target..."
            npm run tauri android init -- --ci --skip-targets-install
          fi

      - name: Build Android Targets
        shell: bash
        run: |
          BUILD_OPT="${{ github.event.inputs.build_type || 'apk' }}"
          if [ "$BUILD_OPT" = "apk" ]; then
            npm run tauri android build -- --apk
          elif [ "$BUILD_OPT" = "aab" ]; then
            npm run tauri android build -- --aab
          else
            npm run tauri android build -- --apk --aab
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Collect Android Outputs
        id: collect
        shell: bash
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-android/ \; || true
          ls -lh dist-android || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-android-packages
          path: dist-android/*
          if-no-files-found: warn
