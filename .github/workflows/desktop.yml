name: Build Desktop (Windows, macOS, Linux)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          # Fix for npm bug #4828: optional platform-specific native binaries omitted across OSes
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rollup/rollup-win32-x64-msvc@^4.63.3 @tauri-apps/cli-win32-x64-msvc@^2.11.4 lightningcss-win32-x64-msvc@^1.32.0 @esbuild/win32-x64@^0.25.12
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm install --no-save @rollup/rollup-darwin-x64@^4.63.3 @rollup/rollup-darwin-arm64@^4.63.3 @tauri-apps/cli-darwin-x64@^2.11.4 @tauri-apps/cli-darwin-arm64@^2.11.4 lightningcss-darwin-x64@^1.32.0 lightningcss-darwin-arm64@^1.32.0 @esbuild/darwin-x64@^0.25.12 @esbuild/darwin-arm64@^0.25.12
          fi

      - name: Build Web Frontend
        run: npm run build

      - name: Build Desktop Bundles
        run: npx tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.tar.gz
          if-no-files-found: warn
