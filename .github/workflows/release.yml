name: Build and Release Kuwnote (Desktop & Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release assets to GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. DESKTOP BUILDS (Windows, macOS, Linux)
  # --------------------------------------------------------------------------
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          # Fix for npm bug #4828: optional platform-specific native binaries omitted across OSes
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rollup/rollup-win32-x64-msvc@^4.63.3 @tauri-apps/cli-win32-x64-msvc@^2.11.4
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm install --no-save @rollup/rollup-darwin-x64@^4.63.3 @rollup/rollup-darwin-arm64@^4.63.3 @tauri-apps/cli-darwin-x64@^2.11.4 @tauri-apps/cli-darwin-arm64@^2.11.4
          fi

      - name: Build Web Application
        run: npm run build

      - name: Build Desktop Binaries
        run: npx tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.tar.gz
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 2. ANDROID BUILD (APK & AAB with Debug Signing)
  # --------------------------------------------------------------------------
  build-android:
    name: Android (APK with Debug Signing)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        shell: bash
        run: |
          ANDROID_SDK_DIR="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_SDK_DIR" ] && [ -d "$ANDROID_HOME" ]; then
            ANDROID_SDK_DIR="$ANDROID_HOME"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_DIR/platform-tools" >> $GITHUB_PATH
          
          # Accept SDK licenses non-interactively
          if [ -f "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure NDK Environment
        shell: bash
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating standard Android debug keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l ~/.android/debug.keystore

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Initialize Android Target (if needed)
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android target..."
            npx tauri android init --ci --skip-targets-install
          fi
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi

      - name: Configure Gradle Signing with Debug Certificate
        shell: bash
        run: |
          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          GRADLE_GROOVY="src-tauri/gen/android/app/build.gradle"

          if [ -f "$GRADLE_KTS" ]; then
            echo "Configuring release signing config in $GRADLE_KTS..."
            if ! grep -q 'signingConfig = signingConfigs' "$GRADLE_KTS"; then
              sed -i 's/getByName("release") {/getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")/' "$GRADLE_KTS"
            fi
          elif [ -f "$GRADLE_GROOVY" ]; then
            echo "Configuring release signing config in $GRADLE_GROOVY..."
            if ! grep -q 'signingConfig signingConfigs' "$GRADLE_GROOVY"; then
              sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' "$GRADLE_GROOVY"
            fi
          fi

      - name: Build Android APK
        shell: bash
        run: |
          echo "Building Android APK..."
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign & Verify Android Artifacts with Debug Certificate
        shell: bash
        run: |
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          echo "Found apksigner at: $APKSIGNER"
          echo "Found zipalign at: $ZIPALIGN"

          mkdir -p dist-android

          # Process all APK files
          while IFS= read -r -d '' apk; do
            echo "--- Checking APK: $apk ---"
            FILENAME=$(basename "$apk")

            # Check existing signature
            if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then
              echo "Valid signature already present on $FILENAME"
              cp "$apk" "dist-android/$FILENAME"
            else
              echo "$FILENAME is unsigned or invalid. Aligning and signing with debug certificate..."
              OUTNAME="${FILENAME/-unsigned/-signed}"
              if [ "$OUTNAME" = "$FILENAME" ]; then
                OUTNAME="signed-$FILENAME"
              fi

              # Zipalign
              "$ZIPALIGN" -f -p 4 "$apk" "dist-android/$OUTNAME" || cp "$apk" "dist-android/$OUTNAME"

              # Sign with apksigner (v1, v2, v3 schemes)
              "$APKSIGNER" sign \
                --ks ~/.android/debug.keystore \
                --ks-pass pass:android \
                --key-pass pass:android \
                --ks-key-alias androiddebugkey \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "dist-android/$OUTNAME"

              # Also maintain primary output name as signed copy
              cp "dist-android/$OUTNAME" "dist-android/$FILENAME"
            fi
          done < <(find src-tauri/gen/android -type f -name "*.apk" -print0)

          # Verify all final APK packages in dist-android
          echo "=== Verification Results for Uploaded APKs ==="
          for apk in dist-android/*.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $(basename "$apk"):"
              "$APKSIGNER" verify --verbose "$apk"
            fi
          done

          ls -lh dist-android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuwnote-android
          path: dist-android/*
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 3. PUBLISH UNIFIED GITHUB RELEASE
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true)
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Directory
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          echo "Files to publish in GitHub Release:"
          ls -lh release-files

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Kuwnote ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## Kuwnote Release ${{ steps.release_tag.outputs.tag }}

            Automated multi-platform build for Kuwnote with debug signing for direct installation.
            
            ### Included Packages:
            - **Windows**: `.exe` (NSIS Installer), `.msi`
            - **macOS**: `.dmg`, `.app`
            - **Linux**: `.deb`, `.AppImage`
            - **Android**: `.apk` (signed with debug certificate)
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
